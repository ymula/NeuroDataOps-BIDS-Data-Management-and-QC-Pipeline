[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neurodataops"
version = "0.1.0"
description = "BIDS research data management and quality-control portfolio project"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3.0",
  "python-dotenv>=1.0,<2.0",
  "PyYAML>=6.0,<7.0",
  "nibabel>=5.2,<6.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
